[project]
name = "overwatch-patrol-ext"
version = "0.1.0"
description = "Overwatch Patrol dimos extension: surveillance module, waypoint router, clip recorder, query module."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "ultralytics>=8.3",
  "opencv-python>=4.10",
  "ffmpeg-python>=0.2",
  "structlog>=24.4",
]

[project.optional-dependencies]
# `dimos` itself is provided via vendor/dimos (editable install in make setup).
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
dimos = { path = "../vendor/dimos", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overwatch_patrol"]
